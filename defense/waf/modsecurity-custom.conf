# MyEduConnect — Phase 5.2 custom WAF rules (ModSecurity), layered on OWASP CRS.
# Mounted into the owasp/modsecurity-crs:nginx container. CRS already blocks the
# generic SQLi/XSS payloads; these add app-specific coverage and clearer logs.

SecRuleEngine On

# Block SQLi markers on /login (VULN-01)
SecRule REQUEST_URI "@contains /login" \
  "id:100001,phase:2,block,t:lowercase,msg:'MYEDU SQLi attempt on /login',chain"
  SecRule ARGS:email "@rx (\'|--|union\s+select|or\s+1\s*=\s*1)" "t:urlDecode,t:htmlEntityDecode"

# Block UNION SQLi on /courses search (VULN-02)
SecRule REQUEST_URI "@contains /courses" \
  "id:100002,phase:1,block,msg:'MYEDU SQLi UNION on /courses search',chain"
  SecRule ARGS:q "@rx (union\s+select|sleep\s*\(|information_schema)" "t:lowercase,t:urlDecode"

# Block <script> XSS in profile/admin POST bodies (VULN-04)
SecRule REQUEST_URI "@rx /(profile|admin)$" \
  "id:100003,phase:2,block,msg:'MYEDU XSS payload in body',chain"
  SecRule REQUEST_BODY "@rx <\s*script[\s>]" "t:htmlEntityDecode,t:lowercase"

# Block dangerous upload extensions on /support (VULN-06)
SecRule REQUEST_URI "@contains /support" \
  "id:100004,phase:2,block,msg:'MYEDU dangerous upload extension',chain"
  SecRule FILES_NAMES "@rx \.(php[0-9]?|phtml|sh|exe|jsp|aspx?|svg|html?)$" "t:lowercase"

# Flag the legacy static API key if it appears (VULN-12)
SecRule REQUEST_HEADERS:X-API-Key "@streq demo-api-key" \
  "id:100005,phase:1,log,msg:'MYEDU legacy static API key seen — rotate',severity:WARNING"
