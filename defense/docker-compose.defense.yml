# MyEduConnect — Phase 5.2/5.3 defense overlay (WAF + TLS).
# Adds a ModSecurity+OWASP-CRS WAF and a TLS reverse proxy in front of the web app,
# WITHOUT removing the direct :8080 endpoint (so you can show an attack succeeding
# directly, then being blocked by the WAF / encrypted by TLS).
#
# Run from the REPO ROOT, together with the base (vulnerable) stack:
#   docker compose -f docker-compose.yml -f defense/docker-compose.defense.yml up -d --build
#
# Endpoints:
#   http://localhost:8080   web app directly  (attack succeeds in vulnerable mode)
#   http://localhost:8088   via WAF           (ModSecurity + CRS -> 403 on SQLi/XSS)
#   https://localhost:8443  via TLS proxy     (encrypted channel)
#
# Generate the TLS cert FIRST (see DEFENSE-RUNBOOK.md).

services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: myeduconnect-waf
    environment:
      BACKEND: "http://web:8080"
      PORT: "8080"
      MODSEC_RULE_ENGINE: "On"
      PARANOIA: "1"
    ports:
      - "8088:8080"
    volumes:
      - ./defense/waf/modsecurity-custom.conf:/etc/modsecurity.d/myeduconnect.conf:ro
    depends_on:
      - web

  tls:
    image: nginx:alpine
    container_name: myeduconnect-tls
    ports:
      - "8443:443"
    volumes:
      - ./defense/tls/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./defense/tls/certs:/etc/nginx/certs:ro
    depends_on:
      - web
