# MyEduConnect — Phase 5.3 TLS reverse proxy (Mozilla "Intermediate" profile).
# Reference: https://ssl-config.mozilla.org/  (nginx, intermediate)
server {
    listen 443 ssl;
    server_name myeduconnect.local;

    ssl_certificate     /etc/nginx/certs/myedu.crt;
    ssl_certificate_key /etc/nginx/certs/myedu.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:MozSSL:10m;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {
    listen 80;
    server_name myeduconnect.local;
    return 301 https://$host$request_uri;
}
